<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskrit Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:      #EDE8DA;
    --cream-deep: #E3DCC9;
    --ink:        #33305B;
    --bus:        #3A5BA0;
    --bus-dark:   #294275;
    --bus-light:  #6285C9;
    --window:     #D6E8F2;
    --roof:       #E8B04B;
    --roof-dark:  #C9932F;
    --tyre:       #262340;
    --peach:      #F2C89A;
    --gold:       #E8B04B;
    --leaf:       #7E8C5A;
    --leaf-dark:  #5F6B42;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(130% 80% at 50% 118%, var(--peach) 0%, transparent 58%),
      linear-gradient(180deg, #F2EEE3 0%, var(--cream) 45%, var(--cream-deep) 100%);
    font-family: 'Fraunces', Georgia, serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* Paper grain — keeps the flat fills from looking vector-clean */
  body::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    opacity: 0.05; mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 20% 30%, #000 0.5px, transparent 0.6px),
      radial-gradient(circle at 70% 60%, #000 0.5px, transparent 0.6px),
      radial-gradient(circle at 45% 85%, #000 0.5px, transparent 0.6px);
    background-size: 7px 7px, 11px 11px, 13px 13px;
  }

  .sun {
    position: absolute; left: 50%; bottom: 27%;
    width: 260px; height: 260px; transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,176,75,0.42) 0%, rgba(242,200,154,0.18) 42%, transparent 70%);
    animation: sunrise 8s ease-in-out infinite;
  }
  @keyframes sunrise {
    0%,100% { transform: translateX(-50%) translateY(16px) scale(0.94); opacity: 0.55; }
    50%     { transform: translateX(-50%) translateY(0)    scale(1);    opacity: 0.85; }
  }

  /* ── Sky: clouds and birds ─────────────────────────────────────── */
  .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  .cloud { position: absolute; opacity: 0.85; }
  .cloud svg { display: block; }
  .c1 { top: 12%; animation: drift 64s linear infinite; }
  .c2 { top: 22%; animation: drift 92s linear infinite; animation-delay: -30s; transform: scale(0.7); }
  .c3 { top: 7%;  animation: drift 78s linear infinite; animation-delay: -55s; transform: scale(1.15); }
  .c4 { top: 30%; animation: drift 110s linear infinite; animation-delay: -80s; transform: scale(0.55); }
  @keyframes drift {
    from { left: -240px; }
    to   { left: 105vw; }
  }

  .birds { position: absolute; top: 17%; left: 22%; animation: soar 26s linear infinite; }
  @keyframes soar {
    from { transform: translate(0,0); }
    50%  { transform: translate(45vw, -30px); }
    to   { transform: translate(90vw, 10px); }
  }
  .bird { animation: flap 1.6s ease-in-out infinite; transform-origin: center; }
  .bird:nth-child(2) { animation-delay: 0.35s; }
  .bird:nth-child(3) { animation-delay: 0.7s; }
  @keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }

  /* ── Land ──────────────────────────────────────────────────────── */
  .hills { position: absolute; inset: 0; overflow: hidden; }
  .hill { position: absolute; left: -6%; width: 112%; border-radius: 50% 50% 0 0; }
  .hill-far  { bottom: 24%; height: 150px; background: #DED2B4; opacity: 0.75; transform: scaleX(1.4); }
  .hill-mid  { bottom: 22%; height: 110px; background: #D2C39C; }
  .hill-near { bottom: 20%; height: 70px;  background: #C3B48B; }

  .road {
    position: absolute; bottom: 19.4%; left: 0; width: 100%; height: 26px;
    background: linear-gradient(180deg, #BCAC81 0%, #AE9E74 100%);
  }
  .road::after {
    content: ''; position: absolute; top: 11px; left: 0; width: 100%; height: 3px;
    background: repeating-linear-gradient(90deg, #E6DCC2 0 46px, transparent 46px 92px);
    opacity: 0.75;
  }

  /* Roadside trees, parallaxing past */
  .tree { position: absolute; bottom: 21%; animation: pass 17s linear infinite; }
  .t1 { animation-delay: 0s; }
  .t2 { animation-delay: -6s; transform: scale(0.78); }
  .t3 { animation-delay: -11.5s; transform: scale(1.12); }
  @keyframes pass { from { left: 104vw; } to { left: -160px; } }

  .milestone { position: absolute; bottom: 20.5%; animation: pass 17s linear infinite; animation-delay: -8.5s; }

  /* ── Bus ───────────────────────────────────────────────────────── */
  .scene { position: absolute; bottom: 20.5%; left: 0; width: 100%; height: 300px; pointer-events: none; }

  .bus-rig {
    position: absolute; bottom: 0; left: 0; width: 520px;
    will-change: transform; backface-visibility: hidden;
    animation: drive 11s cubic-bezier(0.42, 0, 0.58, 1) infinite;
  }
  @keyframes drive {
    0%   { transform: translateX(-560px); }
    30%  { transform: translateX(calc(50vw - 260px)); }
    62%  { transform: translateX(calc(50vw - 260px)); }
    94%  { transform: translateX(calc(100vw + 60px)); }
    100% { transform: translateX(-560px); }
  }

  .bus-bob { animation: bob 0.46s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes bob {
    0%,100% { transform: translateY(0)     rotate(-0.5deg); }
    50%     { transform: translateY(-3.5px) rotate(0.5deg); }
  }

  .bus-svg { width: 520px; height: auto; display: block; overflow: visible; }

  .wheel-spin { transform-origin: center; transform-box: fill-box; animation: spin 0.62s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .kid { animation: kidbob 1.15s ease-in-out infinite; transform-origin: center bottom; }
  .kid:nth-of-type(2) { animation-delay: 0.22s; }
  .kid:nth-of-type(3) { animation-delay: 0.48s; }
  .kid:nth-of-type(4) { animation-delay: 0.14s; }
  @keyframes kidbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

  /* Exhaust smoke */
  .smoke {
    position: absolute; bottom: 34px; left: 6px;
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,116,108,0.5) 0%, rgba(120,116,108,0) 70%);
    opacity: 0; animation: puff 2.6s ease-out infinite;
  }
  @keyframes puff {
    0%   { transform: translate(0,0) scale(0.4); opacity: 0; }
    12%  { opacity: 0.75; }
    100% { transform: translate(-150px,-95px) scale(3); opacity: 0; }
  }

  /* ── Brand ─────────────────────────────────────────────────────── */
  .brand { position: relative; text-align: center; z-index: 5; margin-bottom: 52vh;
           opacity: 0; animation: brandin 1.3s ease-out 3.5s forwards; }
  @keyframes brandin {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .brand .dev {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: clamp(2.6rem, 7.5vw, 4.2rem);
    color: var(--ink); line-height: 1; display: block;
  }
  .brand .coach {
    display: block; margin-top: 0.7rem;
    font-size: clamp(0.68rem, 1.9vw, 0.9rem);
    letter-spacing: 0.62em; text-indent: 0.62em;
    color: var(--bus); text-transform: uppercase; font-weight: 600;
  }
  .rule { width: 54px; height: 1px; background: var(--gold); margin: 1.5rem auto 0; opacity: 0.8; }
  .brand .tag {
    display: block; margin-top: 1.3rem;
    font-size: clamp(0.85rem, 2.2vw, 1rem);
    color: #6E6A56; font-style: italic;
  }
  .dots { margin-top: 1.5rem; display: flex; gap: 9px; justify-content: center;
          opacity: 0; animation: brandin 1s ease-out 4.2s forwards; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--bus);
               animation: blink 1.5s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: 0.22s; }
  .dots span:nth-child(3) { animation-delay: 0.44s; }
  @keyframes blink { 0%,100% { opacity: 0.22; } 50% { opacity: 1; } }

  @media (max-width: 640px) {
    .bus-rig, .bus-svg { width: 340px; }
    @keyframes drive {
      0%   { transform: translateX(-380px); }
      30%  { transform: translateX(calc(50vw - 170px)); }
      62%  { transform: translateX(calc(50vw - 170px)); }
      94%  { transform: translateX(calc(100vw + 40px)); }
      100% { transform: translateX(-380px); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .bus-rig { animation: none; transform: translateX(calc(50vw - 260px)); }
    .bus-bob, .wheel-spin, .kid, .smoke, .sun, .cloud, .tree,
    .milestone, .birds, .bird { animation: none; }
    .brand, .dots { animation: none; opacity: 1; }
    .tree, .milestone { display: none; }
  }
</style>
</head>
<body>

  <div class="sun"></div>

  <!-- Sky -->
  <div class="sky">
    <div class="cloud c1">
      <svg width="200" height="70" viewBox="0 0 200 70">
        <path d="M28 56 q-22 0 -22 -16 q0 -15 17 -16 q3 -18 22 -18 q14 0 20 11
                 q7 -8 18 -8 q19 0 23 18 q20 1 20 16 q0 13 -19 13 z"
              fill="#FBF7EE" opacity="0.95"/>

      </svg>
    </div>
    <div class="cloud c2">
      <svg width="150" height="56" viewBox="0 0 150 56">

              fill="#FBF7EE" opacity="0.9"/>

    </div>

      <svg width="230" height="76" viewBox="0 0 230 76">
        <path d="M32 62 q-26 0 -26 -18 q0 -17 20 -18 q4 -20 26 -20 q16 0 23 12

              fill="#FDFAF3" opacity="0.9"/>
        <path d="M48 57 q12 -7 28 -4" stroke="#E4DCCB" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cloud c4">

                 q5 -5 11 -5 q12 0 15 11 q13 1 13 11 q0 9 -12 9 z"
              fill="#FBF7EE" opacity="0.75"/>
      </svg>
    </div>

    <div class="birds">
      <svg width="90" height="30" viewBox="0 0 90 30">
        <path class="bird" d="M4 14 q7 -8 14 0 q7 -8 14 0" stroke="#8A8574" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path class="bird" d="M38 8 q5 -6 10 0 q5 -6 10 0" stroke="#8A8574" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path class="bird" d="M64 18 q6 -7 12 0 q6 -7 12 0" stroke="#8A8574" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- Land -->
  <div class="hills">
    <div class="hill hill-far"></div>
    <div class="hill hill-mid"></div>
    <div class="hill hill-near"></div>
  </div>
  <div class="road"></div>

  <!-- Roadside furniture, moving right-to-left for parallax -->
  <div class="tree t1">
    <svg width="86" height="120" viewBox="0 0 86 120">
      <path d="M42 118 L42 62" stroke="#8B7355" stroke-width="7" stroke-linecap="round"/>
      <path d="M42 84 L26 70 M42 76 L58 62" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>

      <ellipse cx="58" cy="50" rx="18" ry="15" fill="var(--leaf-dark)" opacity="0.4"/>
      <ellipse cx="43" cy="118" rx="26" ry="4" fill="#000" opacity="0.07"/>
    </svg>
  </div>
  <div class="tree t2">
    <svg width="70" height="100" viewBox="0 0 70 100">
      <path d="M35 98 L35 54" stroke="#8B7355" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="35" cy="36" rx="28" ry="23" fill="var(--leaf)"/>
      <ellipse cx="22" cy="44" rx="15" ry="13" fill="var(--leaf-dark)" opacity="0.5"/>
      <ellipse cx="35" cy="98" rx="21" ry="3.5" fill="#000" opacity="0.07"/>
    </svg>
  </div>
  <div class="tree t3">
    <svg width="78" height="112" viewBox="0 0 78 112">
      <path d="M39 110 L39 58" stroke="#8B7355" stroke-width="6.5" stroke-linecap="round"/>

      <ellipse cx="39" cy="110" rx="23" ry="4" fill="#000" opacity="0.07"/>

  <div class="milestone">
    <svg width="34" height="44" viewBox="0 0 34 44">

  <!-- Bus -->

    <div class="bus-rig">

      <div class="smoke" style="animation-delay: 0.9s;"></div>
      <div class="smoke" style="animation-delay: 1.8s;"></div>

      <div class="bus-bob">

          <ellipse cx="160" cy="178" rx="132" ry="10" fill="#000" opacity="0.09"/>

          <!-- ── Roof luggage rack with school bags ── -->
          <g>
            <rect x="46" y="30" width="200" height="5" rx="2.5" fill="var(--roof-dark)"/>
            <!-- rails -->
            <path d="M50 30 L50 22 M96 30 L96 22 M142 30 L142 22 M188 30 L188 22 M234 30 L234 22"

            <!-- bundled bags on top -->

            <path d="M156 11 q10 -7 19 0" stroke="#5A4571" stroke-width="2" fill="none"/>
            <rect x="192" y="16" width="26" height="15" rx="4" fill="#C98A3E"/>
          </g>

          <!-- ── Body ── -->
          <path d="M22 50 h236 q14 0 22 12 l14 22 q4 6 4 14 v34 q0 10 -10 10 H26
                   q-12 0 -12 -12 V64 q0 -14 8 -14 z" fill="var(--bus)"/>
          <!-- roof cap -->

          <rect x="24" y="46" width="224" height="5" fill="var(--roof-dark)" opacity="0.45"/>

          <!-- destination board -->

          <text x="136" y="47" text-anchor="middle"
                font-family="'Tiro Devanagari Sanskrit', serif" font-size="11" fill="#4A3E2C">पाठशाला</text>

          <!-- side panelling: two tone with a gold pinstripe -->
          <rect x="14" y="118" width="284" height="16" fill="var(--bus-light)" opacity="0.55"/>
          <rect x="14" y="115" width="284" height="2.5" fill="var(--gold)" opacity="0.9"/>
          <!-- rivet line -->
          <g fill="var(--bus-dark)" opacity="0.35">
            <circle cx="34"  cy="126" r="1.6"/><circle cx="62"  cy="126" r="1.6"/>
            <circle cx="90"  cy="126" r="1.6"/><circle cx="118" cy="126" r="1.6"/>
            <circle cx="146" cy="126" r="1.6"/><circle cx="174" cy="126" r="1.6"/>
            <circle cx="202" cy="126" r="1.6"/><circle cx="230" cy="126" r="1.6"/>
            <circle cx="258" cy="126" r="1.6"/>
          </g>
          <!-- subtle body shading under the windows -->
          <rect x="14" y="100" width="284" height="14" fill="#000" opacity="0.06"/>

          <!-- ── Windows ── -->
          <g>
            <rect x="30"  y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="88"  y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="146" y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="204" y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <!-- glass glints -->
            <path d="M34 96 L48 62"  stroke="#fff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
            <path d="M92 96 L106 62" stroke="#fff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
            <path d="M150 96 L164 62" stroke="#fff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
            <path d="M208 96 L222 62" stroke="#fff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>

          <!-- ── Children ── -->

            <path d="M44 100 q11 -16 22 0 z" fill="#4B3E7A"/>          <!-- shoulders/uniform -->

            <circle cx="69" cy="88" r="1.8" fill="#C0603F"/>

            <path d="M218 100 q11 -16 22 0 z" fill="#4B3E7A"/>
            <circle cx="229" cy="82" r="11" fill="#E5BE9A"/>
            <path d="M218 80 a11 11 0 0 1 22 0 q-5 -6 -11 -6 q-6 0 -11 6 z" fill="#3E2A1C"/>
            <circle cx="229" cy="70" r="4" fill="#3E2A1C"/>
            <circle cx="224.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="233.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="225.2" cy="81.3" r="0.7" fill="#fff"/>

<script>
  /* Fills the cold-start wait, then hands off to the app. */
  const BACKEND = 'https://sanskrit-coach.onrender.com';
  const APP = 'app.html';

  /* Always show at least one complete trip.

     Waiting only on serverReady isn't enough: if Render is already awake
     (a recent visit, or a second load), /health answers in milliseconds and
     the very first animationiteration hands off — the student sees the bus
     for a fraction of a second, mid-entry, and it reads as a broken flash
     rather than an intro. Counting laps guarantees a full journey: entry,
     the pause where the kids are visible, and the exit. */
  const MIN_LAPS = 60;

  let serverReady = false;
  let handedOff = false;
  let lapsDone = 0;

  async function awake() {
    try {
      const r = await fetch(BACKEND + '/health', { cache: 'no-store' });
      return r.ok;
    } catch { return false; }
  }

  async function poll() {
    if (await awake()) { serverReady = true; return; }
    setTimeout(poll, 2000);
  }

  /* Driven by the animation, not a timer: wake time swings from milliseconds
     to nearly a minute, so any fixed duration either cuts the bus off
     mid-screen or leaves the student staring at an empty road. We go at the
     end of a lap, when the bus has just cleared the right edge. */
  const rig = document.querySelector('.bus-rig');
  rig.addEventListener('animationiteration', () => {
    lapsDone++;
    if (serverReady && lapsDone >= MIN_LAPS && !handedOff) handoff();
  });

  function handoff() {
    handedOff = true;
    document.body.style.transition = 'opacity 0.8s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = APP; }, 820);
  }

  /* Reduced motion has no animation to count laps on, so fall back to a
     timer long enough to read the title. */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const started = Date.now();
    const check = setInterval(() => {
      if (serverReady && Date.now() - started > 2500 && !handedOff) {
        clearInterval(check);
        handoff();
      }
    }, 400);
  }

  poll();
</script>
