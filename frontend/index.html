<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskrit Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loader.css">
</head>
<body>

  <div class="sun"></div>

  <!-- Sky -->
  <div class="sky">
    <div class="cloud c1">
      <svg width="200" height="70" viewBox="0 0 200 70">
        <path d="M28 56 q-22 0 -22 -16 q0 -15 17 -16 q3 -18 22 -18 q14 0 20 11
                 q7 -8 18 -8 q19 0 23 18 q20 1 20 16 q0 13 -19 13 z"
              fill="#FBF7EE" opacity="0.95"/>
        <path d="M40 52 q10 -6 24 -3" stroke="#E4DCCB" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cloud c2">
      <svg width="150" height="56" viewBox="0 0 150 56">
        <path d="M24 44 q-18 0 -18 -13 q0 -12 14 -13 q3 -14 18 -14 q11 0 16 9
                 q6 -6 14 -6 q15 0 18 14 q16 1 16 13 q0 10 -15 10 z"
              fill="#FBF7EE" opacity="0.9"/>
      </svg>
    </div>
    <div class="cloud c3">
      <svg width="230" height="76" viewBox="0 0 230 76">
        <path d="M32 62 q-26 0 -26 -18 q0 -17 20 -18 q4 -20 26 -20 q16 0 23 12
                 q8 -9 21 -9 q22 0 26 20 q23 1 23 18 q0 15 -22 15 z"
              fill="#FDFAF3" opacity="0.9"/>
        <path d="M48 57 q12 -7 28 -4" stroke="#E4DCCB" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cloud c4">
      <svg width="120" height="46" viewBox="0 0 120 46">
        <path d="M20 36 q-15 0 -15 -11 q0 -10 12 -11 q3 -11 15 -11 q9 0 13 7
                 q5 -5 11 -5 q12 0 15 11 q13 1 13 11 q0 9 -12 9 z"
              fill="#FBF7EE" opacity="0.75"/>
      </svg>
    </div>

    <div class="birds">
      <svg width="90" height="30" viewBox="0 0 90 30">
        <path class="bird" d="M4 14 q7 -8 14 0 q7 -8 14 0" stroke="#8A8574" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path class="bird" d="M38 8 q5 -6 10 0 q5 -6 10 0" stroke="#8A8574" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path class="bird" d="M64 18 q6 -7 12 0 q6 -7 12 0" stroke="#8A8574" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- Land -->
  <div class="hills">
    <div class="hill hill-far"></div>
    <div class="hill hill-mid"></div>
    <div class="hill hill-near"></div>
  </div>
  <div class="road"></div>

  <!-- Roadside furniture, moving right-to-left for parallax -->
  <div class="tree t1">
    <svg width="86" height="120" viewBox="0 0 86 120">
      <path d="M42 118 L42 62" stroke="#8B7355" stroke-width="7" stroke-linecap="round"/>
      <path d="M42 84 L26 70 M42 76 L58 62" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="43" cy="42" rx="34" ry="27" fill="var(--leaf)"/>
      <ellipse cx="26" cy="52" rx="20" ry="16" fill="var(--leaf-dark)" opacity="0.55"/>
      <ellipse cx="58" cy="50" rx="18" ry="15" fill="var(--leaf-dark)" opacity="0.4"/>
      <ellipse cx="43" cy="118" rx="26" ry="4" fill="#000" opacity="0.07"/>
    </svg>
  </div>
  <div class="tree t2">
    <svg width="70" height="100" viewBox="0 0 70 100">
      <path d="M35 98 L35 54" stroke="#8B7355" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="35" cy="36" rx="28" ry="23" fill="var(--leaf)"/>
      <ellipse cx="22" cy="44" rx="15" ry="13" fill="var(--leaf-dark)" opacity="0.5"/>
      <ellipse cx="35" cy="98" rx="21" ry="3.5" fill="#000" opacity="0.07"/>
    </svg>
  </div>
  <div class="tree t3">
    <svg width="78" height="112" viewBox="0 0 78 112">
      <path d="M39 110 L39 58" stroke="#8B7355" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M39 80 L54 66" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="39" cy="40" rx="31" ry="25" fill="var(--leaf)"/>
      <ellipse cx="54" cy="48" rx="17" ry="14" fill="var(--leaf-dark)" opacity="0.45"/>
      <ellipse cx="39" cy="110" rx="23" ry="4" fill="#000" opacity="0.07"/>
    </svg>
  </div>

  <div class="milestone">
    <svg width="34" height="44" viewBox="0 0 34 44">
      <path d="M4 42 L4 14 q13 -12 26 0 L30 42 z" fill="#E6DECA" stroke="#B9AC8D" stroke-width="1.5"/>
      <rect x="4" y="14" width="26" height="11" fill="var(--leaf)" opacity="0.85"/>
      <ellipse cx="17" cy="43" rx="14" ry="2.5" fill="#000" opacity="0.07"/>
    </svg>
  </div>

  <!-- Bus -->
  <div class="scene">
    <div class="bus-rig">
      <div class="smoke" style="animation-delay: 0s;"></div>
      <div class="smoke" style="animation-delay: 0.9s;"></div>
      <div class="smoke" style="animation-delay: 1.8s;"></div>

      <div class="bus-bob">
        <svg class="bus-svg" viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg">

          <ellipse cx="160" cy="178" rx="132" ry="10" fill="#000" opacity="0.09"/>

          <!-- ── Roof luggage rack with school bags ── -->
          <g>
            <rect x="46" y="30" width="200" height="5" rx="2.5" fill="var(--roof-dark)"/>
            <!-- rails -->
            <path d="M50 30 L50 22 M96 30 L96 22 M142 30 L142 22 M188 30 L188 22 M234 30 L234 22"
                  stroke="var(--roof-dark)" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="46" y="20" width="200" height="3" rx="1.5" fill="var(--roof-dark)" opacity="0.8"/>
            <!-- bundled bags on top -->
            <rect x="62" y="12" width="34" height="19" rx="4" fill="#C0603F"/>
            <path d="M68 12 q11 -7 22 0" stroke="#98452C" stroke-width="2" fill="none"/>
            <rect x="104" y="15" width="28" height="16" rx="4" fill="#5F7A55"/>
            <path d="M110 15 q9 -6 17 0" stroke="#45593E" stroke-width="2" fill="none"/>
            <rect x="150" y="11" width="30" height="20" rx="4" fill="#7A6096"/>
            <path d="M156 11 q10 -7 19 0" stroke="#5A4571" stroke-width="2" fill="none"/>
            <rect x="192" y="16" width="26" height="15" rx="4" fill="#C98A3E"/>
          </g>

          <!-- ── Body ── -->
          <path d="M22 50 h236 q14 0 22 12 l14 22 q4 6 4 14 v34 q0 10 -10 10 H26
                   q-12 0 -12 -12 V64 q0 -14 8 -14 z" fill="var(--bus)"/>
          <!-- roof cap -->
          <rect x="24" y="34" width="224" height="18" rx="8" fill="var(--roof)"/>
          <rect x="24" y="46" width="224" height="5" fill="var(--roof-dark)" opacity="0.45"/>

          <!-- destination board -->
          <rect x="88" y="36" width="96" height="14" rx="3" fill="#F4EBD5" stroke="var(--roof-dark)" stroke-width="1.2"/>
          <text x="136" y="47" text-anchor="middle"
                font-family="'Tiro Devanagari Sanskrit', serif" font-size="11" fill="#4A3E2C">पाठशाला</text>

          <!-- side panelling: two tone with a gold pinstripe -->
          <rect x="14" y="118" width="284" height="16" fill="var(--bus-light)" opacity="0.55"/>
          <rect x="14" y="115" width="284" height="2.5" fill="var(--gold)" opacity="0.9"/>
          <!-- rivet line -->
          <g fill="var(--bus-dark)" opacity="0.35">
            <circle cx="34"  cy="126" r="1.6"/><circle cx="62"  cy="126" r="1.6"/>
            <circle cx="90"  cy="126" r="1.6"/><circle cx="118" cy="126" r="1.6"/>
            <circle cx="146" cy="126" r="1.6"/><circle cx="174" cy="126" r="1.6"/>
            <circle cx="202" cy="126" r="1.6"/><circle cx="230" cy="126" r="1.6"/>
            <circle cx="258" cy="126" r="1.6"/>
          </g>
          <!-- subtle body shading under the windows -->
          <rect x="14" y="100" width="284" height="14" fill="#000" opacity="0.06"/>

          <!-- ── Windows ── -->
          <g>
            <rect x="30"  y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="88"  y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="146" y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <rect x="204" y="58" width="50" height="42" rx="8" fill="var(--window)"/>
            <!-- glass glints -->
            <path d="M34 96 L48 62"  stroke="#fff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
            <path d="M92 96 L106 62" stroke="#fff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
            <path d="M150 96 L164 62" stroke="#fff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
            <path d="M208 96 L222 62" stroke="#fff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
          </g>

          <!-- ── Children ── -->
          <!-- 1. wide-eyed, thrilled, twin plaits with red ribbons -->
          <g class="kid">
            <path d="M44 100 q11 -16 22 0 z" fill="#4B3E7A"/>          <!-- shoulders/uniform -->
            <circle cx="55" cy="82" r="11" fill="#D9A87E"/>
            <path d="M44 80 a11 11 0 0 1 22 0 q-4 -6 -11 -6 q-7 0 -11 6 z" fill="#31284A"/>
            <circle cx="42" cy="84" r="3.4" fill="#31284A"/>
            <circle cx="68" cy="84" r="3.4" fill="#31284A"/>
            <circle cx="41" cy="88" r="1.8" fill="#C0603F"/>
            <circle cx="69" cy="88" r="1.8" fill="#C0603F"/>
            <circle cx="50.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="59.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="51.2" cy="81.3" r="0.7" fill="#fff"/>
            <circle cx="60.2" cy="81.3" r="0.7" fill="#fff"/>
            <ellipse cx="55" cy="88" rx="2.6" ry="3" fill="#8E4A4E"/>
            <circle cx="46" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
            <circle cx="64" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
          </g>

          <!-- 2. laughing, eyes shut, arm out of the window waving -->
          <g class="kid">
            <path d="M102 100 q11 -16 22 0 z" fill="#4B3E7A"/>
            <circle cx="113" cy="82" r="11" fill="#E3B98F"/>
            <path d="M102 81 q11 -15 22 0 q-5 -5 -11 -5 q-6 0 -11 5 z" fill="#54341F"/>
            <path d="M107 82 q2.2 -2.6 4.4 0" stroke="#241F38" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M114.6 82 q2.2 -2.6 4.4 0" stroke="#241F38" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="113" cy="88.5" rx="3" ry="2.6" fill="#8E4A4E"/>
            <circle cx="104" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
            <circle cx="122" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
          </g>

          <!-- 3. quiet one, reading, glasses -->
          <g class="kid">
            <path d="M160 100 q11 -16 22 0 z" fill="#4B3E7A"/>
            <circle cx="171" cy="82" r="11" fill="#D9A87E"/>
            <path d="M160 80 a11 11 0 0 1 22 0 q-5 -7 -11 -7 q-6 0 -11 7 z" fill="#26203A"/>
            <!-- spectacles -->
            <circle cx="166.5" cy="82.5" r="4" fill="none" stroke="#4A4258" stroke-width="1.3"/>
            <circle cx="176"   cy="82.5" r="4" fill="none" stroke="#4A4258" stroke-width="1.3"/>
            <path d="M170.5 82.5 h1.5" stroke="#4A4258" stroke-width="1.3"/>
            <circle cx="166.5" cy="82.5" r="1.6" fill="#241F38"/>
            <circle cx="176"   cy="82.5" r="1.6" fill="#241F38"/>
            <path d="M167.5 89 q3.5 2.4 7 0" stroke="#8E4A4E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <!-- little open book held up -->
            <path d="M162 96 l9 -3 l9 3 l-9 3 z" fill="#F4EBD5" stroke="#B9AC8D" stroke-width="1"/>
          </g>

          <!-- 4. cheeky grin, topknot -->
          <g class="kid">
            <path d="M218 100 q11 -16 22 0 z" fill="#4B3E7A"/>
            <circle cx="229" cy="82" r="11" fill="#E5BE9A"/>
            <path d="M218 80 a11 11 0 0 1 22 0 q-5 -6 -11 -6 q-6 0 -11 6 z" fill="#3E2A1C"/>
            <circle cx="229" cy="70" r="4" fill="#3E2A1C"/>
            <circle cx="224.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="233.5" cy="82" r="1.9" fill="#241F38"/>
            <circle cx="225.2" cy="81.3" r="0.7" fill="#fff"/>
            <circle cx="234.2" cy="81.3" r="0.7" fill="#fff"/>
            <path d="M224 87.5 q5 5 10 0 z" fill="#8E4A4E"/>
            <path d="M225.5 88.5 q3.5 1.4 7 0" stroke="#fff" stroke-width="1.5" fill="none"/>
            <circle cx="220" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
            <circle cx="238" cy="87" r="2" fill="#D98A80" opacity="0.45"/>
          </g>

          <!-- ── Front end ── -->
          <!-- windscreen -->
          <path d="M262 58 h12 q6 0 9 6 l10 18 q2 4 -3 4 h-28 z" fill="var(--window)"/>
          <path d="M266 62 L280 84" stroke="#fff" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
          <!-- driver silhouette -->
          <circle cx="272" cy="76" r="6" fill="#3E2A1C"/>
          <path d="M264 88 q8 -10 16 0 z" fill="#4B3E7A"/>
          <!-- side mirror -->
          <path d="M290 62 l10 -6" stroke="var(--bus-dark)" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="298" y="50" width="7" height="11" rx="2" fill="var(--bus-dark)"/>

          <!-- door with a vertical seam and handle -->
          <rect x="238" y="58" width="3" height="76" fill="var(--bus-dark)" opacity="0.55"/>
          <rect x="244" y="92" width="4" height="10" rx="2" fill="var(--bus-dark)" opacity="0.6"/>

          <!-- headlight, indicator, bumper -->
          <circle cx="302" cy="112" r="7" fill="var(--gold)"/>
          <circle cx="302" cy="112" r="3" fill="#FFF3D6"/>
          <rect x="292" y="124" width="12" height="5" rx="2.5" fill="#C0603F"/>
          <rect x="12" y="128" width="296" height="11" rx="5" fill="var(--bus-dark)"/>
          <!-- exhaust pipe at the rear -->
          <rect x="6" y="122" width="12" height="6" rx="3" fill="#4A4258"/>

          <!-- rear lamp -->
          <rect x="14" y="104" width="7" height="12" rx="3" fill="#C0603F"/>

          <!-- ── Wheels ── -->
          <g class="wheel-spin">
            <circle cx="86" cy="146" r="27" fill="var(--tyre)"/>
            <circle cx="86" cy="146" r="20" fill="#332F4E"/>
            <circle cx="86" cy="146" r="11" fill="#D6D0C2"/>
            <circle cx="86" cy="146" r="4"  fill="#9A9484"/>
            <g stroke="#9A9484" stroke-width="2.6" stroke-linecap="round">
              <path d="M86 137 L86 155"/><path d="M77 146 L95 146"/>
              <path d="M79.5 139.5 L92.5 152.5"/><path d="M92.5 139.5 L79.5 152.5"/>
            </g>
          </g>
          <g class="wheel-spin">
            <circle cx="236" cy="146" r="27" fill="var(--tyre)"/>
            <circle cx="236" cy="146" r="20" fill="#332F4E"/>
            <circle cx="236" cy="146" r="11" fill="#D6D0C2"/>
            <circle cx="236" cy="146" r="4"  fill="#9A9484"/>
            <g stroke="#9A9484" stroke-width="2.6" stroke-linecap="round">
              <path d="M236 137 L236 155"/><path d="M227 146 L245 146"/>
              <path d="M229.5 139.5 L242.5 152.5"/><path d="M242.5 139.5 L229.5 152.5"/>
            </g>
          </g>

          <!-- wheel arches drawn over the tyres -->
          <path d="M56 146 a30 30 0 0 1 60 0 h-8 a22 22 0 0 0 -44 0 z" fill="var(--bus)"/>
          <path d="M206 146 a30 30 0 0 1 60 0 h-8 a22 22 0 0 0 -44 0 z" fill="var(--bus)"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="brand">
    <span class="dev">संस्कृत</span>
    <span class="coach">Coach</span>
    <div class="rule"></div>
    <span class="tag">Class is about to begin…</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <script src="js/loader.js"></script>
</body>
</html>
